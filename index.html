<!DOCTYPE html>
<html lang="en">

    <head>

        <meta charset="UTF-8">

        <meta name="viewport"content="width=device-width, initial-scale=1.0">

        <script src="https://cdn.jsdelivr.net/npm/p5@2.2.3/lib/p5.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/p5@2.2.3/lib/addons/p5.sound.min.js"></script>
        <script src="https://unpkg.com/ml5@1/dist/ml5.min.js"></script>
        <link rel="stylesheet" href="styles.css">

        <title>bound</title>

    </head>


    <body>

        <div id="start-screen">
            <div id="start-screen-content">
                <h1>BOUND</h1>
                <p>CLICK ANYWHERE TO START</p>
            </div>
        </div>

        <div id="tutorial" aria-hidden="true">
            <div id="tutorial-card">

                <div id="tutorial-content"></div>

                <div id="tutorial-footer">
                    <button id="tutorial-back" type="button" aria-label="Previous page">←</button>
                    <div id="tutorial-progress"></div>
                    <button id="tutorial-next" type="button" aria-label="Next page">→</button>
                </div>

            </div>
        </div>

        <!-- WEBCAM WINDOW -->

        <div id="camera-window">

            <div id="camera-header">

                <span>CAMERA</span>

                <button id="collapse-button">
                    —
                </button>

            </div>


            <div id="camera-content">

                <div id="camera-placeholder"></div>

            </div>

        </div>

        <div id="settings-window" class="collapsed">

            <div id="settings-header">
                <span>SETTINGS</span>
                <button id="settings-collapse-button">+</button>
            </div>

            <div id="settings-content">

                <div class="settings-group">
                    <span class="settings-label">SYMMETRY</span>
                    <div class="settings-options">
                        <button type="button" data-symmetry="2">2 WAY</button>
                        <button type="button" data-symmetry="4">4 WAY</button>
                        <button type="button" data-symmetry="6">6 WAY</button>
                        <button type="button" data-symmetry="8" class="is-selected">8 WAY</button>
                    </div>
                </div>

                <div class="settings-group">
                    <span class="settings-label">INTENSITY</span>
                    <div class="settings-options settings-intensity-options">
                        <button type="button" data-intensity="low">LOW</button>
                        <button type="button" data-intensity="medium" class="is-selected">MEDIUM</button>
                        <button type="button" data-intensity="high">HIGH</button>
                    </div>
                </div>

                <div class="settings-group">
                    <span class="settings-label">MUSIC</span>
                    <div class="settings-volume">
                        <input
                            id="music-volume"
                            type="range"
                            min="0"
                            max="1"
                            step="0.01"
                            value="0.2"
                            aria-label="Music volume"
                        >
                    </div>
                </div>

            </div>

        </div>

        <div id="controls-window" class="collapsed">

            <div id="controls-header">
                <span>CONTROLS</span>
                <button id="controls-collapse-button">+</button>
            </div>

            <div id="controls-content"></div>

        </div>

        <script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script>
        <script src="sketch.js"></script>
        <script src="ui.js"></script>

    </body>

</html>
